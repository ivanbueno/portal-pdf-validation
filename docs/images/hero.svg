<text x="250" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" letter-spacing="4" fill="#ec7b36" font-weight="600">PDF VALIDATION PORTAL</text>
<text x="250" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#fff7ee">Catch accessibility problems</text>
<text x="250" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#fff7ee">before a PDF goes public.</text>
<line x1="64" y1="266" x2="1136" y2="266" stroke="#3a4560" stroke-width="2"/>
<text x="64" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#fff7ee">2</text><text x="64" y="348" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" letter-spacing="1.5" fill="#e6d2bd">STANDARDS CHECKED</text><text x="340" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#fff7ee">200</text><text x="340" y="348" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" letter-spacing="1.5" fill="#e6d2bd">FILES PER BATCH</text><text x="616" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#fff7ee">5 min</text><text x="616" y="348" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" letter-spacing="1.5" fill="#e6d2bd">MAX PER STANDARD</text><text x="892" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#fff7ee">72 h</text><text x="892" y="348" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" letter-spacing="1.5" fill="#e6d2bd">THEN AUTO-DELETED</text>
