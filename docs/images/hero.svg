<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">PDF Validation Portal</title>
<desc id="d">Accessibility checks for PDFs before they are published: two standards, up to 200 files per batch, results in minutes, deleted after 72 hours.</desc>
