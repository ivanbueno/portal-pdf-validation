<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1060" viewBox="0 0 1680 1060" role="img" aria-labelledby="title desc">
<title id="title">PDF Validation Portal: four Azure resource groups</title>
<desc id="desc">Admin contains identities, Premium ACR and monitoring. Net contains the worker VNet, NSG, private endpoints and DNS. App contains two Container Apps environments, the API and jobs. Data contains Storage and its scoped access grants.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#52718c"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17314b}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#546d83}.heading{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:18px;fill:#405c73}.small{font-size:16px;fill:#546d83}.edge{fill:none;stroke:#52718c;stroke-width:2.5;marker-end:url(#arrow)}.edgeLabel{font-size:16px;fill:#405c73;paint-order:stroke;stroke:#f4f8fc;stroke-width:8px;stroke-linejoin:round}</style>
<rect width="1680" height="1060" fill="#f4f8fc"/>
<text class="title" x="42" y="58">PDF Validation Portal · Azure resource groups</text>
<text class="sub" x="44" y="92">Fresh deployment · env = prod · project = pdfportal · function names · instance numbers when applicable</text>
<rect x="42" y="119" width="1596" height="56" rx="10" fill="#e7eef8"/>
<text class="body" x="64" y="154">Staff / API clients → Microsoft Entra ID + Easy Auth → API in app · Direct browser uploads → Blob in data</text>

<rect x="42" y="210" width="760" height="322" rx="16" fill="#f6f3fc" stroke="#8270b8" stroke-width="2"/>
<rect x="42" y="230" width="5" height="36" rx="2" fill="#8270b8"/>
<text class="heading" x="66" y="253">prod-pdfportal-admin-rg</text>
<text class="small" x="66" y="284">Identity, release images and operations</text>
<text class="label" x="68" y="322">Managed identities</text>
<text class="body" x="68" y="349">prod-pdfportal-admin-id-runtime → API / maintenance</text>
<text class="body" x="68" y="373">prod-pdfportal-admin-id-worker → worker</text>
<text class="label" x="68" y="401">Premium Container Registry</text>
<text class="body" x="68" y="428">Git SHA release images · scoped AcrPull · admin user disabled</text>
<text class="label" x="68" y="480">Log Analytics + action group + alerts</text>
<text class="body" x="68" y="507">30-day logs · processing errors · queue backlog · failed executions</text>
<rect x="878" y="210" width="760" height="322" rx="16" fill="#f0fafc" stroke="#26839b" stroke-width="2"/>
<rect x="878" y="230" width="5" height="36" rx="2" fill="#26839b"/>
<text class="heading" x="902" y="253">prod-pdfportal-net-rg</text>
<text class="small" x="902" y="284">Worker isolation and Private Link</text>
<text class="label" x="904" y="322">Worker VNet + two subnets + NSG</text>
<text class="body" x="904" y="349">Dedicated worker / endpoint subnets · restricted outbound access</text>
<text class="label" x="904" y="401">Four private endpoints</text>
<text class="body" x="904" y="428">Blob · Queue · Table → data · ACR → admin</text>
<text class="label" x="904" y="480">Private DNS zones + VNet links</text>
<text class="body" x="904" y="507">Worker connections resolve to private endpoint addresses</text>
<rect x="42" y="640" width="760" height="322" rx="16" fill="#eff6fe" stroke="#387fd2" stroke-width="2"/>
<rect x="42" y="660" width="5" height="36" rx="2" fill="#387fd2"/>
<text class="heading" x="66" y="683">prod-pdfportal-app-rg</text>
<text class="small" x="66" y="714">Container Apps environments, workloads and authentication</text>
<text class="label" x="68" y="752">prod-pdfportal-app-cae-shared · API + maintenance</text>
<text class="body" x="68" y="779">API: 0.5 vCPU / 1 GiB · 1–3 replicas · HTTPS + Easy Auth</text>
<text class="body" x="68" y="803">Maintenance: 0.5 vCPU / 1 GiB · every 2 minutes</text>
<text class="label" x="68" y="858">prod-pdfportal-app-cae-worker · internal worker environment</text>
<text class="body" x="68" y="885">Worker: 2 vCPU / 4 GiB · queue-triggered · max 4 executions</text>
<text class="body" x="68" y="909">Infrastructure subnet in net · separate worker identity from admin</text>
<rect x="878" y="640" width="760" height="322" rx="16" fill="#f1faf5" stroke="#419176" stroke-width="2"/>
<rect x="878" y="660" width="5" height="36" rx="2" fill="#419176"/>
<text class="heading" x="902" y="683">prod-pdfportal-data-rg</text>
<text class="small" x="902" y="714">Document storage, job state and scoped data access</text>
<text class="label" x="904" y="752">Storage account · Standard LRS</text>
<text class="body" x="904" y="779">documents Blob container: PDFs, snapshots, reports</text>
<text class="body" x="904" y="803">validation Queue + Table: work dispatch and ownership / state</text>
<text class="label" x="904" y="858">Storage role assignments + worker custom roles</text>
<text class="body" x="904" y="885">Runtime storage grants · worker grants scoped to container / queue / table</text>
<text class="body" x="904" y="909">Worker Blob condition: snapshot reads + report writes over Private Link</text>
<path class="edge" d="M290 532 V635"/>
<text class="edgeLabel" x="310" y="582">Identities + image pulls / logs + alerts</text>
<path class="edge" d="M1150 532 V635"/>
<text class="edgeLabel" x="1170" y="582">Private endpoint targets</text>
<path class="edge" d="M802 805 H873"/>
<text class="edgeLabel" x="810" y="784">Data</text>

<text class="small" x="44" y="1002">Cross-group references use full resource IDs. Resource assignments preserve separate runtime and worker permissions.</text>
<text class="small" x="44" y="1030">Azure may also create a service-managed infrastructure group for the worker environment; its lifecycle is owned by Azure.</text>
</svg>
