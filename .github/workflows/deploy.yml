name: Deploy Azure
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PREFIX: ${{ vars.AZURE_PREFIX || 'pdfval' }}
      TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      API_CLIENT_ID: ${{ vars.API_CLIENT_ID }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Compile infrastructure
        run: az bicep build --file infra/main.bicep --outfile /tmp/main.json
      - name: Check worker environment migration
        run: |
          set -euo pipefail
          GROUP_ID=$(az group show --name "$RESOURCE_GROUP" --query id --output tsv)
          EXPECTED_ENV="$GROUP_ID/providers/Microsoft.App/managedEnvironments/$PREFIX-worker-env"
          CURRENT_ENV=$(az containerapp job list --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='$PREFIX-worker'].properties.environmentId | [0]" --output tsv)
          if [ -n "$CURRENT_ENV" ] && [ "${CURRENT_ENV,,}" != "${EXPECTED_ENV,,}" ]; then
            echo "::error::The existing worker must be replaced to change its environment. Follow docs/worker-isolation.md#existing-deployments, then rerun this workflow."
            exit 1
          fi
      - name: Provision foundation
        run: |
          ORIGIN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$PREFIX-api" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)
          ORIGIN="https://${ORIGIN:-configure-after-first-deploy.invalid}"
          echo "ORIGIN=$ORIGIN" >> "$GITHUB_ENV"
          az deployment group create --resource-group "$RESOURCE_GROUP" --name foundation \
            --template-file infra/foundation.bicep --parameters prefix="$PREFIX" portalOrigin="$ORIGIN" --output none
          REGISTRY=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name foundation --query properties.outputs.registryName.value -o tsv)
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
      - name: Build immutable release image
        run: az acr build --registry "$REGISTRY" --image "pdf-validation:$GITHUB_SHA" .
      - name: Deploy application
        env:
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$ENTRA_CLIENT_SECRET"
          SECRET_PARAMS=$(mktemp)
          chmod 600 "$SECRET_PARAMS"
          trap 'rm -f "$SECRET_PARAMS"' EXIT
          python3 - "$SECRET_PARAMS" <<'PY'
          import json, os, sys
          with open(sys.argv[1], 'w') as output:
              json.dump({'entraClientSecret': {'value': os.environ['ENTRA_CLIENT_SECRET']}}, output)
          PY
          az deployment group create --resource-group "$RESOURCE_GROUP" --name portal \
            --template-file infra/main.bicep --parameters prefix="$PREFIX" imageTag="$GITHUB_SHA" \
            tenantId="$TENANT_ID" apiClientId="$API_CLIENT_ID" "@$SECRET_PARAMS" alertEmail="$ALERT_EMAIL" portalOrigin="$ORIGIN" --output none
          ORIGIN=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name portal --query properties.outputs.portalUrl.value -o tsv)
          az deployment group create --resource-group "$RESOURCE_GROUP" --name foundation \
            --template-file infra/foundation.bicep --parameters prefix="$PREFIX" portalOrigin="$ORIGIN" --output none
          echo "Portal: $ORIGIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Configure $ORIGIN/.auth/login/aad/callback as an Entra Web redirect URI before first use." >> "$GITHUB_STEP_SUMMARY"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "$ORIGIN/health/ready"
